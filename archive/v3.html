<title>Ipan · Amirul Irfan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout concept: a miniature Kuala Lumpur shophouse street seen like a tilt-shift diorama.
   DaulatLabs HQ sits in the middle; each neighbouring shop runs one DaulatLabs system.
   UI is a set of soft paper cards floating over the scene. Single committed look. */
:root{
  --ink:#2b2433; --paper:#fffdf9; --soft:#f4efe9; --line:#e6ddd3; --muted:#7a7080; --accent:#e0a43a;
  --f-head:"Fredoka","Avenir Next Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#f3d9b8;color:var(--ink);font:15px/1.55 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tilt{position:fixed;left:0;right:0;height:22vh;pointer-events:none;z-index:1;backdrop-filter:blur(2.6px);-webkit-backdrop-filter:blur(2.6px)}
#tiltTop{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
#tiltBot{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
@media (max-width:700px){.tilt{height:14vh;backdrop-filter:blur(1.6px);-webkit-backdrop-filter:blur(1.6px)}}

.ui{position:fixed;z-index:5}
.card{background:var(--paper);border-radius:18px;box-shadow:0 1px 0 rgba(43,36,51,.06),0 10px 30px rgba(60,40,30,.16)}

/* top bar */
#top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#brand{padding:9px 14px 9px 10px;display:flex;align-items:center;gap:10px;flex:none}
#brand .av{width:34px;height:34px;border-radius:50%;background:#e9b48a;position:relative;overflow:hidden;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
#brand .av::before{content:"";position:absolute;left:-2px;right:-2px;top:-8px;height:18px;border-radius:50%;background:#2a1f1a}
#brand .av::after{content:"";position:absolute;left:10px;top:17px;width:14px;height:4px;border-left:4px solid #2a1f1a;border-right:4px solid #2a1f1a;box-sizing:border-box}
#brand b{display:block;font:600 1rem/1.1 var(--f-head)}
#brand span{font-size:.75rem;color:var(--muted);font-weight:700}
#places{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px 2px 10px}
#places::-webkit-scrollbar{display:none}
#places button{flex:none;display:flex;align-items:center;gap:7px;background:var(--paper);border:0;border-radius:999px;padding:8px 13px 8px 9px;font:600 .85rem/1 var(--f-head);box-shadow:0 4px 14px rgba(60,40,30,.14);white-space:nowrap}
#places button i{width:16px;height:16px;border-radius:50%;border:2px dashed var(--c);display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff;flex:none}
#places button.seen i{background:var(--c);border-style:solid}
#places button.seen i::after{content:"✓"}
#places button.on{box-shadow:0 0 0 2px var(--c),0 4px 14px rgba(60,40,30,.14)}
#timeBtn{flex:none;border:0;padding:9px 13px;font:600 .85rem/1 var(--f-head);display:flex;gap:7px;align-items:center}
#timeBtn svg{width:16px;height:16px}
@media (max-width:760px){#top{flex-wrap:wrap}#brand{order:1}#timeBtn{order:2;margin-left:auto}#places{order:3;flex-basis:100%}}

/* sheet */
#sheet{right:16px;top:calc(env(safe-area-inset-top,0px) + 76px);width:min(400px,calc(100vw - 32px));max-height:calc(100% - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .3s}
#sheet.hide{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
#sheetHead{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 18px}
#sheetHead .dot{width:12px;height:12px;border-radius:4px;background:var(--accent);transform:rotate(45deg);flex:none}
#sheetHead div{flex:1;min-width:0}
#sheetHead h2{margin:0;font:600 1.45rem/1.1 var(--f-head);text-wrap:balance}
#sheetHead small{font-weight:700;font-size:.78rem;color:var(--muted)}
#closeBtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:18px;line-height:1;flex:none}
#sheetBody{padding:0 18px 18px;overflow-y:auto;display:grid;gap:12px;touch-action:pan-y;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
#sheetBody p{margin:0;max-width:62ch}
#sheetBody h3{margin:6px 0 -4px;font:600 .78rem/1 var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#sheetBody ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#sheetBody li{position:relative;padding-left:18px}
#sheetBody li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.status{display:inline-flex;align-items:center;gap:6px;font:700 .75rem/1 var(--f-body);padding:6px 10px;border-radius:999px;background:var(--soft);justify-self:start}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc,#8bbf6a)}
.sysrow{display:grid;gap:6px}
.sysrow button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:10px 12px;font-weight:700}
.sysrow button span:last-child{font-weight:600;font-size:.78rem;color:var(--muted);white-space:nowrap}
.sysrow button i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;background:var(--c);transform:rotate(45deg)}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:11px 13px;text-decoration:none;color:var(--ink);font-weight:700;min-width:0}
.lnk span{overflow-wrap:anywhere;min-width:0}
.copy{border:0;background:var(--ink);color:var(--paper);border-radius:9px;padding:7px 11px;font-weight:700;font-size:.8rem;flex:none}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font:500 1.05rem/1.35 var(--f-head)}
@media (max-width:700px){
  #sheet{left:10px;right:10px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-height:52%}
  #sheet.hide{transform:translateY(calc(100% + 30px))}
  #sheetHead h2{font-size:1.25rem}
}

/* prompt + controls */
#prompt{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,0);border:0;padding:13px 20px;font:600 1rem/1 var(--f-head);display:flex;align-items:center;gap:10px;transition:opacity .2s,transform .2s;touch-action:manipulation}
#prompt kbd{font:700 .72rem/1 var(--f-body);background:var(--soft);border-radius:6px;padding:4px 7px}
#prompt.hide{opacity:0;transform:translate(-50%,12px);pointer-events:none}
#prompt i{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
#joy{left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:104px;height:104px;border-radius:50%;background:rgba(255,253,249,.38);border:2px solid rgba(255,253,249,.8);touch-action:none;display:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--paper);box-shadow:0 4px 12px rgba(60,40,30,.25)}
body.touch #joy{display:block}
body.touch.sheet-open #joy{display:none}
body.sheet-open #hint{opacity:0!important}
body.touch #prompt{left:auto;right:16px;transform:none}
body.touch #prompt.hide{transform:translateY(12px)}
body.touch #prompt kbd{display:none}
@media (max-width:700px){body.sheet-open #prompt{display:none}}
#hint{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);padding:9px 14px;font-weight:700;font-size:.85rem;text-align:center;transition:opacity .6s;pointer-events:none;max-width:88vw}
#toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translate(-50%,-8px);padding:11px 16px;font:600 .95rem/1.3 var(--f-head);text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:86vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{padding:6px 11px;border-radius:14px;font:600 .85rem/1 var(--f-head);pointer-events:none;opacity:0;transition:opacity .25s;transform:translate(-50%,-100%)}
#bubble.on{opacity:1}
#fade{inset:0;background:#fffdf9;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#loading{inset:0;display:grid;place-items:center;background:#f3d9b8;z-index:9;transition:opacity .6s;font:600 1.1rem var(--f-head)}
#loading.gone{opacity:0;pointer-events:none}
#nogl{inset:0;display:none;place-items:center;text-align:center;padding:24px;font:600 1.05rem/1.4 var(--f-head)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<canvas id="gl" tabindex="0" aria-label="A small 3D street. DaulatLabs is in the middle and each shop runs one of its systems. Use the place buttons at the top to read about each one."></canvas>
<div class="tilt" id="tiltTop"></div><div class="tilt" id="tiltBot"></div>
<div class="ui" id="fade"></div>

<div class="ui" id="top">
  <div class="card" id="brand"><div class="av" aria-hidden="true"></div><div><b>Amirul Irfan</b><span>Founder, DaulatLabs</span></div></div>
  <nav id="places" aria-label="Places on the street"></nav>
  <button class="card" id="timeBtn" aria-label="Change time of day"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 .9v1.8M8 13.3v1.8M.9 8h1.8M13.3 8h1.8M3 3l1.2 1.2M11.8 11.8 13 13M3 13l1.2-1.2M11.8 4.2 13 3"/></g></svg><span id="timeLbl">Morning</span></button>
</div>

<section class="ui card hide" id="sheet" aria-live="polite">
  <div id="sheetHead"><span class="dot"></span><div><small id="sheetTag"></small><h2 id="sheetTitle"></h2></div><button id="closeBtn" aria-label="Close">×</button></div>
  <div id="sheetBody"></div>
</section>

<button class="ui card hide" id="prompt"><i></i><span id="promptTxt"></span><kbd>E</kbd></button>
<div class="ui card" id="hint"></div>
<div class="ui card" id="toast" role="status"></div>
<div class="ui card" id="bubble">meow</div>
<div class="ui" id="joy" aria-label="Move stick"><div id="knob"></div></div>
<div class="ui" id="loading">Setting up the street…</div>
<div class="ui" id="nogl"><div>This browser cannot draw the 3D street.<br>The place buttons at the top still open everything.</div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const touchy = matchMedia('(pointer:coarse)').matches;
const small = innerWidth < 700;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (touchy) document.body.classList.add('touch');

/* ============ content ============ */
const SYS = {
  santaka:  {name:'Santaka',  what:'Restaurants',          st:'Early stage', sc:'#7fbf5a'},
  rumika:   {name:'Rumika',   what:'Residents and visitors', st:'In build',  sc:'#e6a83a'},
  mahardika:{name:'Mahardika',what:'Insurance agencies',   st:'In build',    sc:'#e6a83a'},
  arogya:   {name:'Arogya',   what:'Clinics',              st:'In build',    sc:'#e6a83a'},
  pautika:  {name:'Pautika',  what:'Public profiles',      st:'In build',    sc:'#e6a83a'},
};
const PLACES = [
  {id:'hq',       name:'DaulatLabs', tag:'The company I am building', col:'#d99a2b', cta:'Visit DaulatLabs', door:[0,-5.6], look:[0,4.2,-9], cam:[6,6.5,11], r:4.6, pin:14.2},
  {id:'santaka',  name:'Santaka',    tag:'DaulatLabs · restaurants', col:'#e0744a', cta:'Look inside Santaka', door:[-22,-5.6], look:[-22,3.2,-8], cam:[-16,5.5,8], r:5, pin:10.6},
  {id:'rumika',   name:'Rumika',     tag:'DaulatLabs · residents', col:'#9a74c4', cta:'Visit Rumika', door:[31,-5.6], look:[34,5,-12], cam:[25,7,9], r:5, pin:17.8},
  {id:'mahardika',name:'Mahardika',  tag:'DaulatLabs · insurance agencies', col:'#4f9a77', cta:'Look inside Mahardika', door:[-37,-5.6], look:[-37,3.2,-8], cam:[-31,5.5,8], r:4.6, pin:10.6},
  {id:'arogya',   name:'Arogya',     tag:'DaulatLabs · clinics', col:'#2e9e93', cta:'Look inside Arogya', door:[18,-5.6], look:[18,3.2,-8], cam:[24,5.5,8], r:4.6, pin:10.6},
  {id:'pautika',  name:'Pautika',    tag:'DaulatLabs · public profiles', col:'#c4568a', cta:'Try Pautika', door:[-50,-4.2], look:[-50,2.6,-6.5], cam:[-45,4.5,5], r:4.6, pin:10},
  {id:'me',       name:'About me',   tag:'Ipan', col:'#d4772f', cta:'Sit in the wakaf', door:[-6,12.4], look:[-6,1.9,15.5], cam:[-3.5,4.6,25.5], r:4.2, pin:6.4},
  {id:'work',     name:'Day job',    tag:'MAGNET Security & Automation', col:'#2f8579', cta:'Check in at MAGNET', door:[56,-5.6], look:[56,4,-10], cam:[63,7,10], r:5, pin:13.4},
  {id:'mail',     name:'Say hello',  tag:'Contact', col:'#d1453b', cta:'Write to me', door:[9,4.6], look:[9,1.4,6.2], cam:[12.5,3.6,12.5], r:3.2, pin:3.2},
];
const PB = Object.fromEntries(PLACES.map(p=>[p.id,p]));

const shop = (id, body) => { const s=SYS[id]; return `<span class="status" style="--sc:${s.sc}">${s.st}</span>${body}<a class="lnk" href="https://www.daulatlabs.com/" target="_blank" rel="noopener"><span>Read more on daulatlabs.com</span>↗</a>`; };
const CONTENT = {
  hq: () => `<p>DaulatLabs builds software for the small businesses that keep a neighbourhood running: restaurants, clinics, insurance agencies and residential communities.</p>
    <p>A business starts with one system. Every system shares one identity layer, so customers, staff and records carry across when the business adds the next one. The gold line on the pavement outside is that layer.</p>
    <h3>On this street</h3>
    <div class="sysrow">${Object.entries(SYS).map(([k,s])=>`<button data-go="${k}" style="--c:${PB[k].col}"><span><i></i>${s.name}</span><span>${s.what} · ${s.st.toLowerCase()}</span></button>`).join('')}</div>
    <h3>How we work</h3>
    <ul><li>Founder-led, based in Kuala Lumpur.</li><li>We build systems we can run ourselves.</li></ul>
    <p class="quote">Production is truth. We do not sell what is not real.</p>
    <a class="lnk" href="https://www.daulatlabs.com/" target="_blank" rel="noopener"><span>daulatlabs.com</span>↗</a>
    <a class="lnk" href="https://x.com/DaulatLabs" target="_blank" rel="noopener"><span>@DaulatLabs on X</span>↗</a>`,
  santaka: () => shop('santaka', `<p>Santaka runs a restaurant's day: QR ordering at the table, kitchen tickets, and the point of sale.</p><p>One order goes from the table to the kitchen to the counter without anyone writing it down twice.</p>`),
  rumika: () => shop('rumika', `<p>Rumika is a community platform for residential areas. It covers residents, the visitors they invite, and the people who manage the place.</p><p>The guard house is where it shows up first.</p>`),
  mahardika: () => shop('mahardika', `<p>Mahardika handles the day-to-day operations of an insurance agency, in one place.</p>`),
  arogya: () => shop('arogya', `<p>Arogya runs a clinic's working day, from opening to close.</p>`),
  pautika: () => shop('pautika', `<p>Pautika gives an operator a public profile page with action links, so customers can find them and reach them in one tap.</p><p>The screen on the kiosk is a Pautika page.</p>`),
  me: () => `<p>I'm Amirul Irfan. Most people call me Ipan. I'm based in Kuala Lumpur.</p>
    <p>I work on the space where software meets the real world: door readers, front desks, kitchens, clinics. I like problems you can walk up to.</p>
    <h3>How I work</h3>
    <ul><li>I start from the support queue. Real tickets say more than opinions do.</li>
    <li>I write things down: specs, user stories, acceptance criteria.</li>
    <li>Data before arguments. SQL and Power BI are part of my normal week.</li>
    <li>Ship small, then check it in production.</li></ul>
    <h3>What I build with</h3>
    <ul><li>Claude and Codex, every day, for specs as much as for code.</li>
    <li>A Windows toolkit I built to automate support diagnostics: RabbitMQ repair, SQL index fixes, environment setup.</li>
    <li>Side projects on GitHub, like CliniCare and a PDPA self-assessment tool.</li></ul>
    <h3>Learning now</h3>
    <ul><li>ECBA, then PL-300 and PSPO I.</li><li>Done: CompTIA Data+, and Anthropic's Claude Code course.</li></ul>
    <h3>Background</h3>
    <ul><li>BCS Computer Networks &amp; Security (Hons), UTM, 2025. Diploma in Computer Science, UTM, 2022.</li>
    <li>First place, National Consumer Intellectual Challenge 2024.</li></ul>
    <p>I post once a month on LinkedIn about what I'm building and learning.</p>
    <a class="lnk" href="https://linkedin.com/in/amirulirfn" target="_blank" rel="noopener"><span>linkedin.com/in/amirulirfn</span>↗</a>
    <a class="lnk" href="https://github.com/amirulirfn1" target="_blank" rel="noopener"><span>github.com/amirulirfn1</span>↗</a>`,
  work: () => `<p>Software Product Owner at MAGNET Security &amp; Automation since July 2026. I joined as a Software Support Engineer and moved into product within 12 months.</p>
    <ul><li>I own requirements and the backlog for MagEtegra, an on-premise access control system, and MagNicas, a cloud property management platform.</li>
    <li>I lead two developers and run UAT, defect triage and releases.</li>
    <li>In support I handled 10+ customer issues a day at 95% CSAT. Client complaints dropped 30%.</li></ul>
    <h3>Earlier</h3>
    <ul><li>Process &amp; Systems Analyst intern at SLB. Reporting got 30% faster.</li><li>IT Support intern at CTC Global.</li></ul>
    <p style="color:var(--muted);font-size:.85rem">The doors open when you walk up. That is roughly what MagEtegra does all day.</p>`,
  mail: () => `<p>Email is the best way to reach me. Happy to talk about product work, DaulatLabs, or a system your business needs.</p>
    <div class="lnk"><span id="mailAddr">amirulirfan.utm@gmail.com</span><button class="copy" id="copyMail">Copy</button></div>
    <a class="lnk" href="https://linkedin.com/in/amirulirfn" target="_blank" rel="noopener"><span>LinkedIn</span>↗</a>
    <a class="lnk" href="https://github.com/amirulirfn1" target="_blank" rel="noopener"><span>GitHub</span>↗</a>
    <a class="lnk" href="https://www.daulatlabs.com/" target="_blank" rel="noopener"><span>daulatlabs.com</span>↗</a>`,
};

/* ============ UI plumbing ============ */
const seen = new Set();
const placesNav = $('places');
PLACES.forEach(p=>{ const b=document.createElement('button'); b.dataset.p=p.id; b.style.setProperty('--c',p.col); b.innerHTML=`<i></i>${p.name}`; b.onclick=()=>goTo(p.id); placesNav.appendChild(b); });
let openId = null;
function setAccent(c){ document.documentElement.style.setProperty('--accent',c); }
function openSheet(id){
  const p=PB[id]; openId=id; setAccent(p.col);
  $('sheetTitle').textContent=p.name; $('sheetTag').textContent=p.tag; $('sheetBody').innerHTML=CONTENT[id](); $('sheetBody').scrollTop=0;
  $('sheet').classList.remove('hide'); document.body.classList.add('sheet-open');
  if(!seen.has(id)){ seen.add(id); if(seen.size===PLACES.length) setTimeout(()=>toast('You have seen the whole street. Thanks for walking around.'),900); }
  [...placesNav.children].forEach(b=>{ b.classList.toggle('seen',seen.has(b.dataset.p)); b.classList.toggle('on',b.dataset.p===id); });
  wireSheet(); if(window.__world) __world.focus(id);
}
function closeSheet(){ openId=null; $('sheet').classList.add('hide'); document.body.classList.remove('sheet-open'); [...placesNav.children].forEach(b=>b.classList.remove('on')); if(window.__world) __world.focus(null); }
function wireSheet(){
  $('sheetBody').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goTo(b.dataset.go));
  const cm=$('copyMail'); if(cm) cm.onclick=async()=>{ try{ await navigator.clipboard.writeText('amirulirfan.utm@gmail.com'); cm.textContent='Copied'; }catch(_){ const r=document.createRange(); r.selectNodeContents($('mailAddr')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); cm.textContent='Selected'; } setTimeout(()=>cm.textContent='Copy',1500); };
}
$('closeBtn').onclick=closeSheet;
let toastT=0;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2800); }
function goTo(id){ if(window.__world) __world.travel(id); else openSheet(id); }

const hasGL = (()=>{ try{ const c=document.createElement('canvas'); return !!(window.THREE && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }catch(e){ return false; } })();
if(!hasGL){
  ['gl','joy','hint','timeBtn','tiltTop','tiltBot','loading'].forEach(i=>$(i).style.display='none');
  $('nogl').style.display='grid'; openSheet('hq'); return;
}

/* ============ world ============ */
function build(){
const T = THREE;
const C = h => new T.Color(h).convertSRGBToLinear();
const renderer = new T.WebGLRenderer({canvas:$('gl'), antialias:true, powerPreference:'high-performance'});

let seed = 11; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
const MC = {};
function mat(hex, o={}){
  const k = hex+JSON.stringify(o); if(MC[k]) return MC[k];
  const m = new T.MeshStandardMaterial({color:C(hex), roughness:o.r??.85, metalness:o.m??0, transparent:!!o.t, opacity:o.o??1});
  if(o.e){ m.emissive=C(o.e); m.emissiveIntensity=o.ei??1; }
  if(o.side) m.side=o.side;
  return MC[k]=m;
}
const GC = {};
const gBox = (w,h,d) => GC['b'+w+h+d] || (GC['b'+w+h+d]=new T.BoxGeometry(w,h,d));
const gSph = (r,ws=20,hs=14) => GC['s'+r+ws] || (GC['s'+r+ws]=new T.SphereGeometry(r,ws,hs));
const gCyl = (a,b,h,s=16) => GC['c'+a+b+h+s] || (GC['c'+a+b+h+s]=new T.CylinderGeometry(a,b,h,s));
function add(geo, m, x=0,y=0,z=0, parent=scene, cast=true){ const me=new T.Mesh(geo, typeof m==='string'?mat(m):m); me.position.set(x,y,z); me.castShadow=cast; me.receiveShadow=true; parent.add(me); return me; }
const B = (w,h,d,m,x,y,z,p,cast) => add(gBox(w,h,d),m,x,y,z,p,cast);
function rbox(w,h,d,r,m,x,y,z,p){
  const k='rb'+[w,h,d,r]; let g=GC[k];
  if(!g){ const s=new T.Shape(), iw=w-2*r, ih=h-2*r, a=Math.min(r*.6,iw/2,ih/2);
    s.moveTo(-iw/2+a,-ih/2); s.lineTo(iw/2-a,-ih/2); s.quadraticCurveTo(iw/2,-ih/2,iw/2,-ih/2+a); s.lineTo(iw/2,ih/2-a); s.quadraticCurveTo(iw/2,ih/2,iw/2-a,ih/2); s.lineTo(-iw/2+a,ih/2); s.quadraticCurveTo(-iw/2,ih/2,-iw/2,ih/2-a); s.lineTo(-iw/2,-ih/2+a); s.quadraticCurveTo(-iw/2,-ih/2,-iw/2+a,-ih/2);
    g=GC[k]=new T.ExtrudeGeometry(s,{depth:Math.max(.01,d-2*r),bevelEnabled:true,bevelSize:r,bevelThickness:r,bevelSegments:3,curveSegments:4}); g.translate(0,0,-Math.max(.01,d-2*r)/2); g.computeVertexNormals(); }
  return add(g,m,x,y,z,p);
}
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const glowTex = canvasTex(128,128,(g,w)=>{ const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); });

function sign(lines, w, h, bg, fg, opts={}){
  const tex = canvasTex(1024, Math.round(1024*h/w), (g,W,H)=>{
    g.fillStyle=bg; rr(g,6,6,W-12,H-12,opts.round??28); g.fill();
    if(opts.border){ g.lineWidth=10; g.strokeStyle=opts.border; g.stroke(); }
    g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
    const big = Math.min(H*.5, 150);
    g.font=`600 ${big}px Fredoka, "Arial Rounded MT Bold", Arial, sans-serif`;
    g.fillText(lines[0], W/2, lines[1]?H*.42:H*.53);
    if(lines[1]){ g.globalAlpha=.85; g.font=`700 ${Math.round(big*.36)}px Nunito, Arial, sans-serif`; g.fillText(lines[1], W/2, H*.76); }
  });
  const m = new T.MeshStandardMaterial({map:tex, roughness:.55, emissive:C('#ffffff'), emissiveMap:tex, emissiveIntensity:0});
  signMats.push(m);
  return new T.Mesh(new T.PlaneGeometry(w,h), m);
}

    #include <tonemapping_fragment>

/* ---- shophouse ---- */
function shophouse(o){
  const g=new T.Group(); g.position.x=o.x; scene.add(g); tag(g,o.id);
  const F=-7.1, rec=2.3, d=o.d||11, w=o.w, H1=3.7, H2=3.3, fl=o.floors||2;
  B(w,H1,d-rec,o.lower,0,H1/2,F-rec-(d-rec)/2,g);
  B(w,.16,rec,mat('#c9b49a',{r:.9}),0,.2,F-rec/2,g,false);
  for(let i=0;i<Math.floor(w/1.4);i++) B(.03,.01,rec,mat('#b29d82'),-w/2+.7+i*1.4,.29,F-rec/2,g,false);
  B(w*.5,2.5,.1,winMat,-w*.13,1.55,F-rec+.05,g);
  B(w*.5+.24,.16,.18,mat(o.trim),-w*.13,2.86,F-rec+.08,g);
  B(1.5,2.7,.12,mat(o.door||o.trim),w*.3,1.35,F-rec+.06,g);
  add(gSph(.07,8,6),mat('#e8c46a',{m:.6,r:.3}),w*.3-.5,1.35,F-rec+.16,g);
  for(let f=1;f<fl;f++){
    const y0=H1+(f-1)*H2; B(w,H2,d,o.main,0,y0+H2/2,F-d/2,g);
    const n=w>12?3:2; for(let i=0;i<n;i++){ const x=-w/2+w*(i+.5)/n;
      B(1.4,1.7,.1,winMat,x,y0+2.0,F+.04,g);
      B(1.64,.12,.22,mat(o.trim),x,y0+1.12,F+.1,g); B(1.64,.1,.16,mat(o.trim),x,y0+2.9,F+.08,g);
      const sh=mat(o.shutter); const l=B(.36,1.7,.06,sh,x-.98,y0+2.0,F+.08,g); l.rotation.y=.5; const r=B(.36,1.7,.06,sh,x+.98,y0+2.0,F+.08,g); r.rotation.y=-.5;
      for(let k=0;k<3;k++) B(.04,1.7,.03,mat(o.trim),x-.35+k*.35,y0+2.0,F+.1,g,false);
    }
  }
  B(w+.3,.28,.5,mat(o.trim),0,H1+.14,F+.1,g);
  const top=H1+(fl-1)*H2;
  B(w,1.1,.45,o.main,0,top+.55,F-.2,g); B(w+.24,.2,.66,mat(o.trim),0,top+1.18,F-.2,g);
  for(let i=0;i<Math.floor(w/1.2);i++) B(.12,.5,.12,mat(o.trim),-w/2+.6+i*1.2,top+.55,F+.04,g);
  const s=new T.Shape(); s.moveTo(-(d-.6)/2,0); s.lineTo((d-.6)/2,0); s.lineTo(0,2.1); s.lineTo(-(d-.6)/2,0);
  const rg=new T.ExtrudeGeometry(s,{depth:w-.1,bevelEnabled:false}); rg.translate(0,0,-(w-.1)/2);
  const rf=add(rg,mat(o.roof||'#b85b3c',{r:.9}),0,top,F-d/2-.1,g); rf.rotation.y=Math.PI/2;
  const cols=w>12?[-w/2+.35,0,w/2-.35]:[-w/2+.35,w/2-.35];
  cols.forEach(cx=>{ B(.62,H1,.62,o.main,cx,H1/2,F-.35,g); B(.8,.25,.8,mat(o.trim),cx,.12,F-.35,g); });
  const sg=sign(o.sign,w-1.6,.95,o.signBg,o.signFg,{border:o.signBorder}); sg.position.set(0,H1+.62,F+.37); g.add(sg);
  rects.push({x1:o.x-w/2,x2:o.x+w/2,z1:F-d,z2:F-rec});
  cols.forEach(cx=>circles.push({x:o.x+cx,z:F-.35,r:.45}));
  return g;
}

function animate(p,spd,dt,t){
  const k=Math.min(spd/6,1); p.phase+=dt*(4+spd*1.25);
  const s=Math.sin(p.phase)*.75*k;
  p.legs[0].rotation.x=s; p.legs[1].rotation.x=-s; p.arms[0].rotation.x=-s*.9; p.arms[1].rotation.x=s*.9;
  p.torso.position.y=1.3+Math.abs(Math.cos(p.phase))*.07*k+Math.sin(t*2)*.012;
  p.hg.position.y=2.2+Math.abs(Math.cos(p.phase))*.08*k+Math.sin(t*2)*.015;
  p.hg.rotation.z=Math.sin(p.phase*.5)*.05*k;
  p.blink-=dt; if(p.blink<0){ p.eyes.forEach(e=>e.scale.y=.12); if(p.blink<-.12){ p.eyes.forEach(e=>e.scale.y=1); p.blink=2+rnd()*3.5; } }
}

joyEl.addEventListener('pointerdown',e=>{ joy.id=e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); P.target=null; });
joyEl.addEventListener('pointermove',e=>{ if(e.pointerId===joy.id) joyMove(e); });
const joyEnd=e=>{ if(e.pointerId!==joy.id) return; joy.id=null; joy.x=joy.z=0; knob.style.transform=''; };

  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,true);
  if(hits.length){ let o=hits[0].object; while(o&&!o.userData.place) o=o.parent; if(o){ const p=PB[o.userData.place]; P.target={x:p.door[0],z:p.door[1]}; pendingOpen=p.id; return; } }
  if(ray.ray.intersectPlane(gPlane,hit)){ P.target={x:hit.x,z:hit.z}; pendingOpen=null; }
}

/* travel */
let fading=false;
function travel(id){
  const p=PB[id]; if(fading) return; fading=true; $('fade').style.opacity=1;
  setTimeout(()=>{ P.x=p.door[0]; P.z=p.door[1]+(id==='me'||id==='mail'?-0:.0); P.target=null; P.face=(id==='me')?Math.PI:Math.PI; H.g.position.set(P.x,0,P.z); cat.position.set(P.x-1.4,0,P.z+(id==='me'?-1.2:1.2));
    openSheet(id); snapCam(); $('fade').style.opacity=0; fading=false; },260);
}

/* ============ loop ============ */
let focusId=null; function focus(id){ focusId=id; }
const camPos=new T.Vector3(), camLook=new T.Vector3();
function desiredCam(){
  if(focusId){ const p=PB[focusId]; const portrait=camera.aspect<.9;
    const L=new T.Vector3(...p.look), Cp=new T.Vector3(...p.cam);
    Cp.sub(L).multiplyScalar(portrait?1.3*1.2/camera.aspect:1.3).add(L);
    if(portrait){ L.y-=3.2; Cp.y+=1.5; }
    else if(!small){ const off=new T.Vector3().subVectors(L,Cp).cross(new T.Vector3(0,1,0)).normalize().multiplyScalar(3.2); L.add(off); Cp.add(off); }
    return [Cp,L]; }
  const k=zoom*(camera.aspect<.9?1.45:1);
  return [new T.Vector3(P.x, 14*k, P.z+25*k), new T.Vector3(P.x, 1.6, P.z-3)];
}
function snapCam(){ const [a,b]=desiredCam(); camPos.copy(a); camLook.copy(b); }
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=camera.aspect<.9?40:32; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

let nearId=null; const clock=new T.Clock(); const tmp=new T.Vector3(); const sunDir=new T.Vector3();
let hintShown=true, moved=false;
const lerpC=(a,b,k)=>a.lerp(b,k);
function collide(o,r=.45){
  for(const q of rects){ if(o.x>q.x1-r&&o.x<q.x2+r&&o.z>q.z1-r&&o.z<q.z2+r){ const dl=o.x-(q.x1-r),dr=q.x2+r-o.x,dn=o.z-(q.z1-r),ds=q.z2+r-o.z,m=Math.min(dl,dr,dn,ds); if(m===dl)o.x=q.x1-r; else if(m===dr)o.x=q.x2+r; else if(m===dn)o.z=q.z1-r; else o.z=q.z2+r; } }
  for(const c of circles){ const dx=o.x-c.x,dz=o.z-c.z,d=Math.hypot(dx,dz),m=c.r+r; if(d<m&&d>1e-4){ o.x=c.x+dx/d*m; o.z=c.z+dz/d*m; } }
  o.x=Math.max(-66,Math.min(76,o.x)); o.z=Math.max(-9.6,Math.min(40,o.z));
}
const dust=[]; let dustT=0;
function puff(x,z){ const m=add(gSph(.18,8,6),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6,depthWrite:false}),x,.2,z,scene,false); dust.push({m,life:.6}); }

function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  /* time of day */
  const tt=TIMES[tKey], lk=1-Math.exp(-dt*1.6);
  lerpC(cur.top,C(tt.top),lk); lerpC(cur.hor,C(tt.hor),lk); lerpC(cur.sun,C(tt.sun),lk); lerpC(cur.hs,C(tt.hs),lk); lerpC(cur.hg,C(tt.hg),lk);
  ['sunI','el','az','hI','win','lamp','stars','exp'].forEach(k=>cur[k]+=(tt[k]-cur[k])*lk);
  skyU.top.value.copy(cur.top); skyU.hor.value.copy(cur.hor); skyU.sunCol.value.copy(cur.sun); skyU.stars.value=cur.stars;
  sunDir.set(Math.cos(cur.el)*Math.sin(cur.az),Math.sin(cur.el),Math.cos(cur.el)*Math.cos(cur.az)).normalize(); skyU.sunDir.value.copy(sunDir);
  sun.color.copy(cur.sun); sun.intensity=cur.sunI; hemi.color.copy(cur.hs); hemi.groundColor.copy(cur.hg); hemi.intensity=cur.hI; scene.fog.color.copy(cur.hor);
  renderer.toneMappingExposure=cur.exp;
  winMat.emissiveIntensity=cur.win*1.3; signMats.forEach(m=>m.emissiveIntensity=.08+cur.win*.55); glowMat.opacity=cur.lamp*.85; poolMat.opacity=cur.lamp*.55; bulbMat.emissiveIntensity=.2+cur.lamp*3; headMat.emissiveIntensity=cur.lamp*2.5; lineMat.emissiveIntensity=.45+cur.win*1.4;
  document.body.style.background='#'+cur.hor.clone().convertLinearToSRGB().getHexString();

  /* movement */
  let ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
  let iz=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)+joy.z;
  let m=Math.hypot(ix,iz); if(m>1){ ix/=m; iz/=m; m=1; }
  if(m>.05){ P.target=null; pendingOpen=null; }
  if(P.target&&m<=.05){ const dx=P.target.x-P.x, dz=P.target.z-P.z, d=Math.hypot(dx,dz);
    if(d<.35){ P.target=null; if(pendingOpen){ openSheet(pendingOpen); pendingOpen=null; } } else { ix=dx/d; iz=dz/d; m=Math.min(1,d/1.2+.35); } }
  const spd=(keys['shift']?11:7);
  P.vx+=(ix*spd*m-P.vx)*Math.min(1,dt*10); P.vz+=(iz*spd*m-P.vz)*Math.min(1,dt*10);
  const ox=P.x, oz=P.z; P.x+=P.vx*dt; P.z+=P.vz*dt; collide(P);
  const realSpd=Math.hypot(P.x-ox,P.z-oz)/Math.max(dt,1e-3);
  if(P.target){ if(realSpd<.4){ P.stuck+=dt; if(P.stuck>.7){ P.target=null; if(pendingOpen){ const pp=PB[pendingOpen]; if(Math.hypot(P.x-pp.door[0],P.z-pp.door[1])<pp.r) openSheet(pendingOpen); pendingOpen=null; } } } else P.stuck=0; }
  if(Math.hypot(P.vx,P.vz)>.6){ P.face=Math.atan2(P.vx,P.vz); P.idle=0; if(!moved){ moved=true; setTimeout(()=>$('hint').style.opacity=0,1200); } } else P.idle+=dt;
  let dr=P.face-H.g.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); H.g.rotation.y+=dr*Math.min(1,dt*12);
  const sitting = openId==='me' && Math.hypot(P.x+6,P.z-12.4)<6;
  if(sitting && m>.05){ closeSheet(); }
  if(sitting){ H.g.position.set(-6,.86,15.25); H.g.rotation.y=0; animate(H,0,dt,t); H.legs.forEach(l=>l.rotation.x=-1.45); H.arms.forEach((a,i)=>{ a.rotation.x=-1.1+Math.sin(t*9+i*2)*.12; }); }
  else { H.g.position.set(P.x,0,P.z); animate(H,realSpd,dt,t); }
  H.g.rotation.x = sitting?0:Math.min(realSpd/7,1)*.08;
  pins.forEach(pn=>{ pn.m.rotation.y=t*1.4; pn.m.position.y=pn.y+Math.sin(t*2+pn.y)*.25; const tgt=seen.has(pn.id)?.55:1; pn.m.scale.setScalar(pn.m.scale.x+(tgt-pn.m.scale.x)*dt*3); });
  if(P.idle>2.5 && !openId){ P.wave+=dt; const w=(P.wave%7); if(w<1.6){ H.arms[1].rotation.z=-2.5; H.arms[1].rotation.x=Math.sin(w*12)*.35; } else { H.arms[1].rotation.z=.12; } } else { P.wave=0; H.arms[1].rotation.z=.12; }
  heroShadow.position.set(P.x,.19,P.z);
  dustT-=dt; if(realSpd>3&&dustT<0){ dustT=.18; puff(P.x-Math.sin(P.face)*.4,P.z-Math.cos(P.face)*.4); }
  for(let i=dust.length-1;i>=0;i--){ const d=dust[i]; d.life-=dt; d.m.scale.setScalar(1+(.6-d.life)*2.2); d.m.material.opacity=Math.max(0,d.life)*.9; d.m.position.y+=dt*.6; if(d.life<=0){ scene.remove(d.m); d.m.material.dispose(); dust.splice(i,1); } }

  /* proximity */
  let best=null,bd=1e9; for(const p of PLACES){ const d=Math.hypot(P.x-p.door[0],P.z-p.door[1]); if(d<p.r&&d<bd){ bd=d; best=p; } }
  nearId=best?best.id:null;
  if(best&&!openId){ $('promptTxt').textContent=best.cta; $('prompt').classList.remove('hide'); setAccent(best.col); } else $('prompt').classList.add('hide');
  if(openId&&!fading){ const p=PB[openId]; if(Math.hypot(P.x-p.door[0],P.z-p.door[1])>p.r+2.5 && !P.target) closeSheet(); }

  /* cat */
  { const bx=P.x-Math.sin(P.face)*1.5+Math.cos(P.face)*1.1, bz=P.z-Math.cos(P.face)*1.5-Math.sin(P.face)*1.1;
    const dx=bx-cat.position.x, dz=bz-cat.position.z, d=Math.hypot(dx,dz); let cs=0;
    if(d>.6){ cs=Math.min(8,d*2.6); cat.position.x+=dx/d*cs*dt; cat.position.z+=dz/d*cs*dt; CT.face=Math.atan2(dx,dz); }
    const cp={x:cat.position.x,z:cat.position.z}; collide(cp,.3); cat.position.x=cp.x; cat.position.z=cp.z;
    let r=CT.face-cat.rotation.y; r=Math.atan2(Math.sin(r),Math.cos(r)); cat.rotation.y+=r*Math.min(1,dt*8);
    CT.phase+=dt*cs*2.2; catO.legs.forEach((l,i)=>l.rotation.x=Math.sin(CT.phase+(i%2?Math.PI:0)+(i>1?Math.PI:0))*.7*Math.min(cs/3,1));
    CT.sit+=((cs<.3?1:0)-CT.sit)*Math.min(1,dt*4); catO.body.rotation.x=-.35*CT.sit; catO.body.position.y=.45-.08*CT.sit; catO.legs[2].visible=catO.legs[3].visible=CT.sit<.6;
    catO.tail.rotation.z=Math.sin(t*(cs>.3?6:2))*.5; catO.head.rotation.y=Math.sin(t*.7)*.3*CT.sit;
    CT.meow-=dt; const bub=$('bubble');
    if(CT.meow<0&&CT.sit>.8&&!openId){ CT.meow=14+rnd()*12; bub.classList.add('on'); setTimeout(()=>bub.classList.remove('on'),1600); }
    tmp.set(cat.position.x,1.3,cat.position.z).project(camera); bub.style.left=((tmp.x+1)/2*innerWidth)+'px'; bub.style.top=((1-tmp.y)/2*innerHeight)+'px'; }

  /* villagers */
  npcs.forEach(n=>{ const g=n.p.g; let s=0;
    if(n.wait>0){ n.wait-=dt; } else { const blocked=Math.hypot(g.position.x+n.dir*1.2-P.x,g.position.z-P.z)<1.2; if(!blocked){ g.position.x+=n.dir*n.spd*dt; s=n.spd; } if(g.position.x>n.b){ n.dir=-1; n.wait=1+rnd()*3; } if(g.position.x<n.a){ n.dir=1; n.wait=1+rnd()*3; } if(rnd()<dt*.08) n.wait=1.5+rnd()*2.5; }
    const f=n.wait>0?0:(n.dir>0?Math.PI/2:-Math.PI/2); const target=n.wait>0?g.rotation.y:f; let r=target-g.rotation.y; r=Math.atan2(Math.sin(r),Math.cos(r)); g.rotation.y+=r*Math.min(1,dt*8);
    animate(n.p,s,dt,t); n.p.col.x=g.position.x; n.p.col.z=g.position.z; });
  sitters.forEach((p,i)=>{ animate(p,0,dt,t); p.legs.forEach(l=>l.rotation.x=-1.45); p.arms[0].rotation.x=-.9+Math.sin(t*1.3+i)*.15; p.hg.rotation.y=Math.sin(t*.5+i*2)*.4; });

  /* cars */
  cars.forEach(c=>{ const ahead=c.g.position.x+c.dir*3.2; const blocked=Math.abs(P.z-c.z)<2.2 && (c.dir>0?(P.x>c.g.position.x&&P.x<c.g.position.x+7):(P.x<c.g.position.x&&P.x>c.g.position.x-7));
    c.v+=((blocked?0:c.spd)-c.v)*Math.min(1,dt*(blocked?4:1)); c.g.position.x+=c.dir*c.v*dt; c.g.position.y=Math.sin(t*9)*.015*(c.v/c.spd);
    if(c.g.position.x>82) c.g.position.x=-72; if(c.g.position.x<-72) c.g.position.x=82; });

  /* props */
  pulses.forEach((p,i)=>{ p.userData.t+=dt*.12; if(p.userData.t>1) p.userData.t=0; const k=p.userData.t; p.position.x=p.userData.from*(1-k); p.scale.setScalar(.6+Math.sin(k*Math.PI)*.6); });
  trees.forEach(g=>g.rotation.z=Math.sin(t*.8+g.userData.sway)*.012);
  clouds.forEach((g,i)=>{ g.position.x+=dt*(1+i%3*.4); if(g.position.x>160) g.position.x=-160; });
  { const d=Math.hypot(P.x-56,P.z+7.6); doorOpen+=((d<6.5?1:0)-doorOpen)*Math.min(1,dt*5); doorL.position.x=-.95-doorOpen*1.7; doorR.position.x=.95+doorOpen*1.7; ledM.emissive.copy(doorOpen>.5?C('#3dd68c'):C('#ff3b2f')); ledM.color.copy(ledM.emissive); }
  { const d=Math.hypot(P.x-31.4,P.z+6); boomUp+=((d<5?1:0)-boomUp)*Math.min(1,dt*3); boom.rotation.z=boomUp*1.35; }

  /* sun follows hero for crisp shadows */
  sun.position.set(P.x+sunDir.x*80,sunDir.y*80,P.z+sunDir.z*80); sun.target.position.set(P.x,0,P.z-4);

  /* camera */
  const [dc,dl]=desiredCam(); const ck=1-Math.exp(-dt*(focusId?2.6:4)); camPos.lerp(dc,ck); camLook.lerp(dl,ck);
  camera.position.copy(camPos); camera.lookAt(camLook); sky.position.copy(camera.position);

  renderer.render(scene,camera); requestAnimationFrame(frame);
}

window.__world={focus,travel};
H.g.position.set(P.x,0,P.z); H.g.rotation.y=0;
openSheet('hq'); snapCam();
$('hint').textContent = touchy ? 'Drag the stick or tap the street to walk.' : 'Walk with WASD or the arrow keys (Shift to run), or click anywhere on the street.';
requestAnimationFrame(frame);
setTimeout(()=>$('loading').classList.add('gone'),150);
window.__dbg={P,travel,cycleTime,openSheet};
}

const go=()=>{ try{ build(); }catch(err){ console.error(err); ['gl','joy','hint','timeBtn','tiltTop','tiltBot'].forEach(i=>$(i).style.display='none'); $('loading').classList.add('gone'); $('nogl').style.display='grid'; openSheet('hq'); } };
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(), new Promise(r=>setTimeout(r,1800))]).then(go);
})();
</script>
